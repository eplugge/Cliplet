name: Cliplet
options:
  bundleIdPrefix: nu.plugge.macOS
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClipletCore:
    path: .
targets:
  Cliplet:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClipletApp
      - path: AppStore/Assets.xcassets
    dependencies:
      - package: ClipletCore
        product: ClipletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nu.plugge.macOS.cliplet
        PRODUCT_NAME: Cliplet
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "75J677Q8TZ"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore/Cliplet.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Eelco Plugge"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
